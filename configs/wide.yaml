# Wide model candidate (2048 x 8, 68M parameters). Same as base.yaml otherwise.
# Steps per stage and the final model size are Gate C decisions (docs/decisions.md).
prefix: run
width: 2048
blocks: 8
batch_size: 4096
lr: 0.001
weight_decay: 0.0001
warmup_steps: 500
grad_clip: 1.0
total_steps: 100000
n_stages: 10
log_every: 200
val_every: 2000
ckpt_every: 2000
keep_every: 10000
